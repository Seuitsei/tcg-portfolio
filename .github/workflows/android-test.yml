name: Android test APK
on:
  push:
    branches: [android/test-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm run android:init
        working-directory: mobile
      - run: ./gradlew assembleDebug --no-daemon --console=plain
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: craft-drop-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n fr.craftdrop.tcgtest/.MainActivity
            sleep 15
            adb shell pidof fr.craftdrop.tcgtest
            adb exec-out screencap -p > android-emulator.png
            adb logcat -d > android-emulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: |
            android-emulator.png
            android-emulator.log
