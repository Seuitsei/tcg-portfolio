name: Android test APK
on:
  push:
    branches: [android/test-apk]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify fixed navigation in browser
        run: |
          npm install --prefix /tmp/nav-browser playwright@1.51.1
          /tmp/nav-browser/node_modules/.bin/playwright install --with-deps chromium
          node tests/camera.mjs
          node tests/photo-quality.cjs
          CODEX_PRIMARY_RUNTIME_NODE_MODULES=/tmp/nav-browser/node_modules node tests/navigation.cjs
          CODEX_PRIMARY_RUNTIME_NODE_MODULES=/tmp/nav-browser/node_modules node tests/fold-camera-browser.cjs
      - run: npm ci && npm run android:init
        working-directory: mobile
      - run: ./gradlew assembleDebug --no-daemon --console=plain
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: craft-drop-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - run: python3 -m pip install Pillow websocket-client
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: |
            adb install mobile/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n fr.craftdrop.tcgtest2/.MainActivity
            sleep 15
            adb shell pidof fr.craftdrop.tcgtest2
            adb exec-out screencap -p > android-emulator.png
            python3 mobile/test_navigation.py
            python3 mobile/test_camerax.py
            adb logcat -d > android-emulator.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-evidence
          path: |
            android-emulator.png
            android-emulator.log
            android-nav-*.png
            android-camerax-*.png
            android-camerax-result.json

